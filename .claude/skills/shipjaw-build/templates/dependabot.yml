# Copy to .github/dependabot.yml at scaffold time.
# Monorepo: duplicate the npm block per app/package directory, e.g.
# directory: "/apps/web", "/apps/api", "/packages/contracts".
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
